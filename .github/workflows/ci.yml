name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packages (editable, same set as README's dev setup)
        run: |
          pip install -e packages/schemas -e packages/data-sdk -e packages/agent-sdk -e packages/config \
                      -e packages/db -e services/data -e services/fundamentals -e services/risk \
                      -e services/paper-execution -e services/agents -e services/quant -e services/alpha \
                      -e services/enterprise_data -e apps/api

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Run full test suite
        run: pytest

  frontend-build:
    name: Frontend build (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes TypeScript type-checking)
        run: npm run build
