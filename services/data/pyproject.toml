[project]
name = "alphagasiq-service-data"
version = "0.1.0"
description = "Data ingestion platform: provider connectors for AlphaGasIQ"
requires-python = ">=3.11"
dependencies = [
  "alphagasiq-schemas",
  "alphagasiq-data-sdk",
  "alphagasiq-config",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["data_service*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
