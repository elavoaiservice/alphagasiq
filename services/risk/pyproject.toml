[project]
name = "alphagasiq-service-risk"
version = "0.1.0"
description = "Independent risk engine and deterministic Risk Governor for AlphaGasIQ"
requires-python = ">=3.11"
dependencies = ["alphagasiq-schemas"]

[tool.setuptools.packages.find]
include = ["risk_service*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
