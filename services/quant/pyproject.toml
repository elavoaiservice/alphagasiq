[project]
name = "alphagasiq-service-quant"
version = "0.1.0"
description = "Quantitative platform: point-in-time-correct forecasting, regime detection, relative value, and walk-forward backtesting"
requires-python = ">=3.11"
dependencies = [
  "alphagasiq-schemas",
  "alphagasiq-service-fundamentals",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["quant_service*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
