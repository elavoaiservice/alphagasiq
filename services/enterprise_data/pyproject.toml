[project]
name = "alphagasiq-service-enterprise-data"
version = "0.1.0"
description = "Enterprise Data Platform: BaseEnterpriseDataConnector framework for AlphaGasIQ"
requires-python = ">=3.11"
dependencies = [
  "alphagasiq-schemas",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "boto3>=1.34",
  "paramiko>=3.4",
]

[tool.setuptools.packages.find]
include = ["enterprise_data_service*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
