[project]
name = "alphagasiq-data-sdk"
version = "0.1.0"
description = "Provider abstraction framework for AlphaGasIQ data ingestion"
requires-python = ">=3.11"
dependencies = ["alphagasiq-schemas", "pydantic>=2.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["data_sdk*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
