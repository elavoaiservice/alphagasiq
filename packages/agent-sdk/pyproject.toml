[project]
name = "alphagasiq-agent-sdk"
version = "0.1.0"
description = "Base agent runtime, LLM provider abstraction, and event bus for AlphaGasIQ"
requires-python = ">=3.11"
dependencies = ["alphagasiq-schemas", "pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["agent_sdk*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
