[project]
name = "alphagasiq-config"
version = "0.1.0"
description = "Branding + environment configuration shared across AlphaGasIQ services"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.2"]

[tool.setuptools.packages.find]
include = ["config*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
