[project]
name = "alphagasiq-schemas"
version = "0.1.0"
description = "Canonical Pydantic schemas shared across AlphaGasIQ services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["schemas*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
